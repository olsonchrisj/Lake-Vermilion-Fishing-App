<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>LV app tests</title>
<style>body{font:14px system-ui;padding:16px}.ok{color:#187a3a}.bad{color:#b00020;font-weight:600}</style></head>
<body><h2>Scoring / weather logic tests</h2><div id="out">Running…</div>
<iframe id="app" src="index.html" style="width:400px;height:600px;position:absolute;left:-9999px"></iframe>
<script>
// Loads the real app in a hidden iframe and exercises its pure functions.
document.getElementById('app').addEventListener('load', () => {
  const w = document.getElementById('app').contentWindow;
  const results = [];
  const t = (name, fn) => { try { const r = fn(); results.push([name, r === true || r === undefined, r]); } catch (e) { results.push([name, false, e.message]); } };
  const eq = (a, b) => a === b || `expected ${b}, got ${a}`;
  const spot = (kind, species = ['walleye']) => ({ kind, species });
  const base = { windMph: 10, frontLikely: false, precipSoon: false, lowLight: false, brightCalm: false };

  t('front: wind swing + rain', () => eq(w.isFrontLikely({ shiftDeg: 90, precipSoon: true, windJump: 0 }), true));
  t('front: swing without rain', () => eq(w.isFrontLikely({ shiftDeg: 90, precipSoon: false, windJump: 0 }), false));
  t('front: big wind jump alone', () => eq(w.isFrontLikely({ shiftDeg: 0, precipSoon: false, windJump: 8 }), true));
  t('front: calm', () => eq(w.isFrontLikely({ shiftDeg: 10, precipSoon: false, windJump: 2 }), false));

  t('bays beat humps when wind > 20', () => w.scoreSpot(spot('bay'), { ...base, windMph: 25 }).score > w.scoreSpot(spot('hump'), { ...base, windMph: 25 }).score || 'bay should win');
  t('points beat bays in moderate wind', () => w.scoreSpot(spot('point'), base).score > w.scoreSpot(spot('bay'), base).score || 'point should win');
  t('humps lose in dead calm', () => w.scoreSpot(spot('hump'), { ...base, windMph: 2 }).score < w.scoreSpot(spot('hump'), base).score || 'calm should hurt');
  t('pre-frontal boosts structure', () => w.scoreSpot(spot('hump'), { ...base, frontLikely: true }).score > w.scoreSpot(spot('hump'), base).score || 'no boost');
  t('walleye better evening than midday', () => w.scoreSpot(spot('bay'), { ...base, bucket: 'evening' }).score > w.scoreSpot(spot('bay'), { ...base, bucket: 'midday' }).score || 'wrong order');
  t('smallmouth better midday than night', () => w.scoreSpot(spot('bay', ['smallmouth']), { ...base, bucket: 'midday' }).score > w.scoreSpot(spot('bay', ['smallmouth']), { ...base, bucket: 'night' }).score || 'wrong order');
  t('multi-species uses best fit', () => w.scoreSpot(spot('bay', ['walleye', 'perch']), { ...base, bucket: 'midday' }).score >= w.scoreSpot(spot('bay', ['walleye']), { ...base, bucket: 'midday' }).score || 'should not be worse');

  t('escapeHtml', () => eq(w.escapeHtml('<b>"x"</b>'), '&lt;b&gt;&quot;x&quot;&lt;/b&gt;'));
  t('decodeEntities numeric', () => eq(w.decodeEntities('a &#8211; b &amp; c'), 'a – b & c'));
  t('safeUrl blocks javascript:', () => eq(w.eval('safeUrl')('javascript:alert(1)'), '#'));
  t('distance: 1 deg lat ≈ 69 mi', () => Math.abs(w.distanceMi([47, -92], [48, -92]) - 69) < 0.5 || 'off');
  t('bearing north', () => eq(w.bearingLabel([47, -92], [48, -92]), 'N'));
  t('classifyHour', () => eq(w.classifyHour(6), 'morning') === true && eq(w.classifyHour(13), 'midday') === true && eq(w.classifyHour(22), 'night') === true);
  t('all SPOTS have valid kind + species', () => w.eval('SPOTS').every(s => ['bay', 'point', 'current', 'hump'].includes(s.kind) && s.species.every(x => w.eval('SPECIES_INFO')[x])) || 'bad spot');

  // --- analysis.js ---
  const D = (y, m, d) => new Date(y, m - 1, d, 12);
  t('climatology Aug 5 is the warmest (~75)', () => Math.abs(w.climatologyWaterTemp(D(2026, 8, 5)) - 75) < 1 || 'off');
  t('climatology falls through September', () => w.climatologyWaterTemp(D(2026, 9, 28)) < w.climatologyWaterTemp(D(2026, 9, 5)) || 'not falling');
  t('parseTempRange', () => eq(w.parseTempRange('69–72'), 70.5));
  t('water temp prefers a fresh report', () => eq(w.estimateWaterTemp([{ date: '2026-09-24', waterTempF: '58–60' }], D(2026, 9, 26)).source, 'guide report'));
  t('water temp ignores stale report', () => eq(w.estimateWaterTemp([{ date: '2026-08-01', waterTempF: '70–72' }], D(2026, 9, 26)).source, 'seasonal average'));
  t('phase: 68F in Aug = summer', () => eq(w.seasonPhase(D(2026, 8, 20), 70).key, 'summer'));
  t('phase: 60F in Sept = early-fall', () => eq(w.seasonPhase(D(2026, 9, 12), 60).key, 'early-fall'));
  t('phase: 54F in Oct = turnover', () => eq(w.seasonPhase(D(2026, 10, 5), 54).key, 'turnover'));
  t('phase: 44F in Nov = late-fall', () => eq(w.seasonPhase(D(2026, 11, 8), 44).key, 'late-fall'));
  t('phase: 56F in Sept still early-fall (not turnover yet)', () => eq(w.seasonPhase(D(2026, 9, 26), 56).key, 'early-fall'));
  t('phase: 55F flips to turnover range check', () => eq(w.seasonPhase(D(2026, 10, 2), 54.5).key, 'turnover'));
  t('phase: 46F = late-fall', () => eq(w.seasonPhase(D(2026, 10, 25), 46).key, 'late-fall'));
  t('every phase has look/adjust/next guidance', () => Object.values(w.eval('PHASES')).every(p => p.look.length >= 2 && p.adjust.length >= 2 && p.next) || 'missing guidance');
  t('phase: 45F in May = spring-spawn (warming, not fall)', () => eq(w.seasonPhase(D(2026, 5, 5), 45).key, 'spring-spawn'));
  t('phase: 55F in May = post-spawn', () => eq(w.seasonPhase(D(2026, 5, 25), 55).key, 'post-spawn'));
  const obs = (arr) => arr.map(([hAgo, pa]) => ({ properties: { timestamp: new Date(Date.UTC(2026, 8, 26, 12) - hAgo * 3600000).toISOString(), barometricPressure: { value: pa } } }));
  t('pressure falling', () => eq(w.pressureTrend(obs([[0, 100800], [1, 101000], [3, 101300], [6, 101700], [12, 102100]])).label, 'falling'));
  t('pressure rising', () => eq(w.pressureTrend(obs([[0, 102000], [1, 101800], [3, 101500], [6, 101100], [12, 100800]])).label, 'rising'));
  t('pressure steady + high flag', () => { const p = w.pressureTrend(obs([[0, 102100], [1, 102100], [3, 102150], [6, 102200], [12, 102200]])); return p.label === 'steady' && p.high === true || 'wrong'; });
  t('pressure needs enough data', () => eq(w.pressureTrend(obs([[0, 102000]])), null));
  t('report depths parsed (12 to 25 feet, 28-34 ft)', () => { const s = w.parseReportSignals([{ date: '2026-09-24', rawText: 'Walleyes in 12 to 25 feet on a Lindy Rig with leeches. Also 28-34 ft trolling.' }], D(2026, 9, 26), 14); return s.rangeCount === 2 && s.techniques.includes('lindy rig / live-bait rig') || JSON.stringify(s); });
  t('old reports ignored for signals', () => eq(w.parseReportSignals([{ date: '2026-08-01', rawText: 'fish in 10-15 ft' }], D(2026, 9, 26), 14).reportCount, 0));
  t('depthOverlap full/partial/none', () => w.depthOverlap([10, 20], [8, 30]) === 1 && Math.abs(w.depthOverlap([10, 20], [15, 40]) - 0.5) < 1e-9 && w.depthOverlap([10, 20], [25, 30]) === 0 || 'bad');
  t('all SPOTS have a depth range', () => w.eval('SPOTS').every(s => Array.isArray(s.depth) && s.depth[0] < s.depth[1]) || 'missing depth');
  const ctxTurn = { phase: w.seasonPhase(D(2026, 10, 5), 54), signals: null, pressure: null };
  t('in-season depth beats off-season depth', () => w.scoreSpot({ kind: 'hump', species: ['walleye'], depth: [12, 20] }, { ...base, ctx: ctxTurn }).score > w.scoreSpot({ kind: 'hump', species: ['walleye'], depth: [40, 50] }, { ...base, ctx: ctxTurn }).score || 'depth ignored');
  t('guide-reported depth boosts overlapping spot', () => { const c = { phase: null, signals: { hotDepth: [12, 25] }, pressure: null }; return w.scoreSpot({ kind: 'hump', species: ['walleye'], depth: [14, 22] }, { ...base, ctx: c }).score > w.scoreSpot({ kind: 'hump', species: ['walleye'], depth: [30, 40] }, { ...base, ctx: c }).score || 'no boost'; });
  t('falling barometer boosts structure over bays', () => { const c = { phase: null, signals: null, pressure: { label: 'falling', d3: -2 } }; return w.scoreSpot(spot('hump'), { ...base, ctx: c }).score > w.scoreSpot(spot('bay'), { ...base, ctx: c }).score || 'no boost'; });
  t('rising barometer favors sheltered bays over humps', () => { const c = { phase: null, signals: null, pressure: { label: 'rising', d3: 2 } }; return w.scoreSpot(spot('bay'), { ...base, ctx: c }).score > w.scoreSpot(spot('hump'), { ...base, ctx: c }).score || 'wrong'; });
  t('seasonAdviceForSpot mentions each species', () => { const a = w.seasonAdviceForSpot({ species: ['walleye', 'perch'], depth: [12, 20] }, ctxTurn.phase); return a && a.parts.length === 2 || 'bad'; });

  t('sonar: no thermocline + cooling water => turnover', () => { const r = w.interpretSonar({ thermo: 'no' }, 58, 'early-fall'); return r.phaseKey === 'turnover' && r.overridden || JSON.stringify(r); });
  t('sonar: no thermocline in warm water does not force turnover', () => eq(w.interpretSonar({ thermo: 'no' }, 66, 'early-fall').phaseKey, 'early-fall'));
  t('sonar: distinct thermocline blocks turnover', () => { const r = w.interpretSonar({ thermo: 'yes', depth: 24 }, 52, 'turnover'); return r.phaseKey === 'early-fall' && r.thermoDepth === 24 || JSON.stringify(r); });
  t('sonar: none => no change', () => eq(w.interpretSonar(null, 52, 'turnover').phaseKey, 'turnover'));
  t('sonar: heavy clutter note differs in turnover', () => w.interpretSonar({ clutter: 'heavy' }, 52, 'turnover').notes[0] !== w.interpretSonar({ clutter: 'heavy' }, 66, 'early-fall').notes[0] || 'same');
  t('spot below marked thermocline scores lower', () => { const c = { phase: null, signals: null, pressure: null, thermoDepth: 20 }; return w.scoreSpot({ kind: 'bay', species: ['walleye'], depth: [28, 34] }, { ...base, ctx: c }).score < w.scoreSpot({ kind: 'bay', species: ['walleye'], depth: [12, 18] }, { ...base, ctx: c }).score || 'no penalty'; });
  const bad = results.filter(r => !r[1]).length;
  document.getElementById('out').innerHTML = `<p class="${bad ? 'bad' : 'ok'}">${results.length - bad}/${results.length} passed</p>` +
    results.map(([n, ok, d]) => `<div class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'} ${n}${ok ? '' : ' — ' + d}</div>`).join('');
  document.title = `${results.length - bad}/${results.length} passed`;
});
</script></body></html>
